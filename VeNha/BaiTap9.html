<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>

/* 1. Cai dat chung */
body {
    background-color: #F2F0EB;
    font-family: Arial, sans-serif;
}

/* 2. Khung chinh */
#profile {
    width: 600px;
    margin: 30px auto;
    padding: 25px;
    background-color: white;
    border-radius: 15px;
}

/* 3. Tieu de */
.header {
    text-align: center;
    color: #263C50;
    font-size: 30px;
    margin-bottom: 25px;
}

/* 4. Thong tin ca nhan */
.personal {
    text-align: center;
    padding: 20px;
    background-color: #EAF0F4;
    border-radius: 10px;
}

.avatar {
    font-size: 70px;
    color: #365C78;
}

.personal h2 {
    color: #263C50;
}

/* 5. Thong tin lien he */
.information {
    padding: 15px;
    color: #45566A;
}

.information h2 {
    color: #263C50;
}

.information i {
    color: #547C9B;
    width: 25px;
}

/* 6. So thich */
.interests {
    padding: 15px;
}

.interests h2 {
    color: #263C50;
}

.interest-list {
    text-align: center;
}

.interest-item {
    display: inline-block;
    width: 22%;
    padding: 10px 0;
    background-color: #EAF0F4;
    border-radius: 8px;
    color: #365C78;
}

.interest-item i {
    font-size: 28px;
}

.interest-item p {
    font-size: 12px;
}

/* 7. Mang xa hoi */
.social {
    text-align: center;
    padding: 15px;
    color: #263C50;
}

.social i {
    font-size: 30px;
    margin: 10px;
    color: #365C78;
    cursor: pointer;
}

</style>
<div id="profile">

    <h1 class="header">
        <i class="fas fa-user-graduate"></i>
        MY PROFILE
    </h1>

    <div class="personal">

        <div class="avatar">
            <i class="fas fa-user-circle"></i>
        </div>

        <h2>DƯƠNG TRUNG HIẾU</h2>
        <p>University Student | E-commerce</p>

    </div>

    <div class="information">

        <h2>
            <i class="fas fa-address-card"></i>
            PERSONAL INFORMATION
        </h2>

        <p>
            <i class="fas fa-envelope"></i>
            Email: dhiu1302@gmail.com
        </p>

        <p>
            <i class="fas fa-phone"></i>
            Phone: 0799121311
        </p>

        <p>
            <i class="fas fa-map-marker-alt"></i>
            Location: Ho Chi Minh City
        </p>

    </div>

    <div class="interests">

        <h2>
            <i class="fas fa-heart"></i>
            MY INTERESTS
        </h2>

        <div class="interest-list">

            <div class="interest-item">
                <i class="fas fa-laptop-code"></i>
                <p>Technology</p>
            </div>

            <div class="interest-item">
                <i class="fas fa-book-open"></i>
                <p>Learning</p>
            </div>

            <div class="interest-item">
                <i class="fas fa-microphone"></i>
                <p>Speaking</p>
            </div>

            <div class="interest-item">
                <i class="fas fa-camera"></i>
                <p>Creativity</p>
            </div>

        </div>

    </div>

    <div class="social">

        <h2>CONNECT WITH ME</h2>

        <i class="fab fa-facebook"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-github"></i>

    </div>

</div>
