<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

#wrapper {
    width: 200px;
    margin: 20px auto;
    border: 5px double black;
    padding: 5px;
}
header {
    height: 40px;
    border: 2px solid black;
    margin-bottom: 5px;
    padding: 5px;
}
nav {
    display: inline-block;
    width: 20%;
    height: 180px;
    border: 2px solid black;
    vertical-align: top;
    box-sizing: border-box;
}
main {
    display: inline-block;
    width: 78%;
    height: 180px;
    border: 2px solid black;
    vertical-align: top;
    box-sizing: border-box;
}
footer {
    height: 40px;
    border: 2px solid black;
    margin-top: 5px;
    padding: 5px;
}
</style>
<body>
    <div id="wrapper">
        <header></header>
        <nav></nav>
        <main></main>
        <footer></footer>
    </div>
</body>
</html>
