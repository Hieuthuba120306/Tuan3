<!DOCTYPE html>
<html>
  <head>
    <title>Tạo responsive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,

initial-scale=1.0">
    <style>
      .left,
      .right {
        height: 400px;
      }

      .left {
        background: blue;
        float: left;
        width: 70%;
      }

      .right {
        background: red;
        float: right;
        width: 30%;
      }
      @media only screen and (max-width: 768px){
        .left,.right{
        width: 100%
        }
      }
      /* Nếu chiều rộng của trình duyệt từ 320px đến 480px thì ẩn class Right */
        @media only screen and (max-width: 479px) and (min-width:321px) {
        .right{
        display: none
        }
      }
      /* Nếu ở chế độ máy in thì ẩn class Left */
         @media only print {
        .left{
        display: none
        }
      }
    </style>
  </head>
  <body>
  <div class="container">
    <div class="left"> LEFT </div>
    <div class="right"> RIGHT </div>
  </div>
</body>
</html>
